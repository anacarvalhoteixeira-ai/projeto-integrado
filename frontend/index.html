<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Tech+</h1>
        <p>Lista de Produtos</p>
    </header>


    <main>

        <!-- LISTAR -->
        <section>

            <h2>Consultar Produtos</h2>

            <button id="btnListar">
                Listar Todos
            </button>

        </section>


        <!-- FILTRAR -->
        <section>

            <h2>Filtrar por Categoria</h2>

            <input
                type="text"
                id="categoria"
                placeholder="Ex: informatica"
            >

            <button id="btnFiltrar">
                Filtrar
            </button>

        </section>


        <!-- BUSCAR ID -->
        <section>

            <h2>Buscar por ID</h2>

            <input
                type="number"
                id="id"
                placeholder="Ex: 1"
            >

            <button id="btnBuscar">
                Buscar
            </button>

        </section>


        <!-- CADASTRAR -->
        <section>

            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço"
                    required
                >

                <input
                    type="text"
                    id="categoriaCadastro"
                    placeholder="Categoria"
                    required
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <!-- MENSAGEM -->

        <div id="mensagem"></div>


        <!-- PRODUTOS -->

        <section>

            <h2>Produtos</h2>

            <div id="produtos">

                <p>
                    Clique em "Listar Todos" para ver os produtos.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
